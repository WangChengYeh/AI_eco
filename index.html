  &lt;script type=&quot;application/json&quot; id=&quot;ts-data&quot;&gt;[{&quot;scenario&quot;:&quot;base&quot;,&quot;evidence&quot;:[{&quot;title&quot;:&quot;Optimus 2027全年100萬台&quot;,&quot;verdict&quot;:&quot;積極估算，未獲年度指引支持&quot;,&quot;finding&quot;:&quot;Fremont設計年產能100萬台，加上德州長期1,000萬台目標，提供規模方向依據。&quot;,&quot;limits&quot;:&quot;產線設計不是2027全年產量；Musk對Fremont達目標產速仍給至少一年以上的爬坡說法，2027達100萬台需Fremont與德州順利接力。&quot;,&quot;musk&quot;:&quot;已搜尋Musk本人X及財報發言；報導提到2027開產或年底外部交付，未確認2027產量1,000萬台。&quot;},{&quot;title&quot;:&quot;Optimus優先內用&quot;,&quot;verdict&quot;:&quot;內用方向有支持&quot;,&quot;finding&quot;:&quot;找到Musk先內用、後對外的歷年說法與近期報導。&quot;,&quot;limits&quot;:&quot;尚無平均內用100萬台或每台年省3萬美元的可核對實績；舊時程已變動。&quot;,&quot;musk&quot;:&quot;已搜尋Tesla internal use原話；2024發言只作方向與歷史目標，不當2027進度證據。&quot;},{&quot;title&quot;:&quot;Optimus剩餘出租&quot;,&quot;verdict&quot;:&quot;出租方向有支持&quot;,&quot;finding&quot;:&quot;11月6日Baron訪談逐字稿及報導均記載Musk傾向出租。&quot;,&quot;limits&quot;:&quot;未公布月租、簽約數及出租率；傾向出租不證明任何指定的全年平均付費台數。&quot;,&quot;musk&quot;:&quot;已定位主辦方原片及第三方逐字稿；租賃段落原片尚未直接核對，不把轉述冒充已觀看。&quot;},{&quot;title&quot;:&quot;2027年底太空算力量產&quot;,&quot;verdict&quot;:&quot;有目標支持，規模待核&quot;,&quot;finding&quot;:&quot;SpaceX官方索引有late2027快速製造部署目標；Musk談過2027起發射。&quot;,&quot;limits&quot;:&quot;11月Baron第三方逐字稿轉述為2027先少量、2028顯著放量、2029更大規模；與2027即大量的口徑有差異。2027製造1GW、部署1GW均未被證實；年化產速不等於全年累計。&quot;,&quot;musk&quot;:&quot;已找Musk六月訪談及十一月訪談線索；後者第三方稿與原片入口已記錄，未冒稱直接驗證錄影。&quot;},{&quot;title&quot;:&quot;Robotaxi年中滿產&quot;,&quot;verdict&quot;:&quot;支持擴線，不支持已達滿產&quot;,&quot;finding&quot;:&quot;查到Musk年中調整Cybertruck產線、6/7月擴Cybercab線的原貼URL及轉述。&quot;,&quot;limits&quot;:&quot;拆線或擴產時點不是完成爬坡、滿產台數或監管放行。7月起滿產與年化125,000台仍是兩個獨立模型假設。&quot;,&quot;musk&quot;:&quot;兩個Musk X原貼均直接讀取403；記錄為原貼未讀、轉述已定位，不能視為原文直接核實。&quot;},{&quot;title&quot;:&quot;資金缺口用股票換資源&quot;,&quot;verdict&quot;:&quot;特定交易支持&quot;,&quot;finding&quot;:&quot;SpaceX頻譜交易申報列有股份對價，直接支持特定資產可用股權交換。&quot;,&quot;limits&quot;:&quot;交易另含現金與債務安排；不支持所有日常資源100%接受股份，或每個資金缺口都能無限發股補足。協議價不是市場通用貨幣價。&quot;,&quot;musk&quot;:&quot;已搜尋Musk及公司股權資源案例；具體契約以SEC條款為主，不以個人願景取代。&quot;},{&quot;title&quot;:&quot;股票取代貨幣&quot;,&quot;verdict&quot;:&quot;強版本尚未成立&quot;,&quot;finding&quot;:&quot;股權作特定企業及資產對價有案例，支持資源交換功能的局部擴張。&quot;,&quot;limits&quot;:&quot;尚無本輪證據證明廣泛商品以股權標價、第三方日常再支付或股票取代法幣。&quot;,&quot;musk&quot;:&quot;Musk談過貨幣未來可能不重要；這不等於他確認股票取代貨幣，不能把兩個命題混為一談。&quot;},{&quot;title&quot;:&quot;AI降本與全球通縮&quot;,&quot;verdict&quot;:&quot;降本有支持，通縮有條件&quot;,&quot;finding&quot;:&quot;Stanford固定能力門檻的推論價格資料支持部分數位AI價格下降；BIS研究支持生產力供給擴張可抑制通膨。&quot;,&quot;limits&quot;:&quot;API查詢價格不是供應商完整任務成本。BIS同時指出投資與收入需求效果可能推升物價，未證明全球必然通縮。&quot;,&quot;musk&quot;:&quot;已找到The Economist發佈的Musk通縮訪談影片與描述，屬Musk預測，未當宏觀實績。&quot;},{&quot;title&quot;:&quot;軟體及物流護城河&quot;,&quot;verdict&quot;:&quot;競爭機制有依據，全面取代未證實&quot;,&quot;finding&quot;:&quot;AI價格下降及Robotaxi部署顯示部分任務自動化與新競爭途徑。&quot;,&quot;limits&quot;:&quot;全面取代、任何服務都能低成本複製及單一企業永遠領先尚未有直接證據；資料、整合、監管、利用率與現場維運仍影響全成本。&quot;,&quot;musk&quot;:&quot;已搜尋Musk相關論述；其機器人生產力推測不等於各產業護城河已消失。&quot;},{&quot;title&quot;:&quot;OpenAI／Anthropic股票付供應商&quot;,&quot;verdict&quot;:&quot;投資有證據，抵付未證實&quot;,&quot;finding&quot;:&quot;Anthropic與OpenAI公告供應商投資和算力合作；TSMC董事會核准兩家公司股權投資。&quot;,&quot;limits&quot;:&quot;核准投資、現金入股與算力採購不能直接視為用股份抵付GPU或晶圓帳款；未查到對應的直接抵付條款。&quot;,&quot;musk&quot;:&quot;已搜尋公司原始公告；Musk不是這些交易條款的充分證據來源，不以他的評論補齊未披露契約。&quot;},{&quot;title&quot;:&quot;Tesla與SpaceX合併&quot;,&quot;verdict&quot;:&quot;評估已披露，成交未定&quot;,&quot;finding&quot;:&quot;兩家公司原始季度申報均披露特別委員會評估可能交易。&quot;,&quot;limits&quot;:&quot;未有本輪驗證的最終合併協議、換股條件或已交割證據；文件明示可能不成交。&quot;,&quot;musk&quot;:&quot;找到Musk財報會議相關轉述；交易狀態以兩家公司申報為準。&quot;},{&quot;title&quot;:&quot;買進後不必再檢視&quot;,&quot;verdict&quot;:&quot;無法作為保證命題&quot;,&quot;finding&quot;:&quot;長期生產力與資源交換循環是可追蹤的投資假說。&quot;,&quot;limits&quot;:&quot;沒有來源能保證持續成本領先、任意價格買入都獲利或永不需要檢視；稀釋、估值、投入與治理均可能改變每股結果。&quot;,&quot;musk&quot;:&quot;已納入Musk未來願景，但未找到能證明永久報酬或免檢視的證據。&quot;},{&quot;title&quot;:&quot;Optimus 2028全年500萬台&quot;,&quot;verdict&quot;:&quot;積極估算，未獲年度指引支持&quot;,&quot;finding&quot;:&quot;公司揭露F     const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
